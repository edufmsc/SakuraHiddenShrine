name: Main Full Browser QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-full-browser-qa.yml'
      - 'qa/full-browser-qa.mjs'
      - 'index.html'
      - 'story.js'
      - 'story_overrides_v1.js'
      - 'pixel_overrides_v1.js'
      - 'interaction_story_overrides_v1.js'
      - 'story_visual_fix_v2.js'
      - 'interaction_ui_overrides_v1.js'
      - 'script.js'
      - 'style.css'
      - 'style_overrides_v1.css'
      - 'ui_overrides_v1.js'
      - 'state_integrity_v1.js'
      - 'assets/images/**'

permissions:
  contents: read

jobs:
  browser-qa:
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
        choice: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run ${{ matrix.device }} choice ${{ matrix.choice }} QA
        env:
          QA_DEVICE: ${{ matrix.device }}
          QA_CHOICE_OFFSET: ${{ matrix.choice }}
        run: node qa/full-browser-qa.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-full-browser-qa-${{ matrix.device }}-choice${{ matrix.choice }}
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 14
