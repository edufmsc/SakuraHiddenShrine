name: Import V58 final images

on:
  push:
    branches:
      - review/v58-scene-lock
    paths:
      - 'SakuraHiddenShrine_0819_final_images.zip'
      - '.github/workflows/import-final-images.yml'

permissions:
  contents: write

jobs:
  import-final-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/v58-scene-lock
          fetch-depth: 0

      - name: Verify import package
        shell: bash
        run: |
          set -euo pipefail
          test -f SakuraHiddenShrine_0819_final_images.zip
          rm -rf /tmp/sakura-final-images
          mkdir -p /tmp/sakura-final-images
          unzip -q SakuraHiddenShrine_0819_final_images.zip -d /tmp/sakura-final-images
          count=$(find /tmp/sakura-final-images/assets/images/active -type f -name '*.webp' | wc -l | tr -d ' ')
          if [ "$count" != "29" ]; then
            echo "Expected 29 WebP files, found $count"
            exit 1
          fi

      - name: Import and classify images
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/sakura-final-images/assets/images/active/. assets/images/active/
          cp /tmp/sakura-final-images/IMAGE_IMPORT_MANIFEST.md scene-lock-v1/production/IMAGE_IMPORT_MANIFEST_0819.md

      - name: Commit imported images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/active/01_love \
                  assets/images/active/02_career \
                  assets/images/active/03_life \
                  assets/images/active/04_forbidden \
                  assets/images/active/05_fifth \
                  assets/images/active/06_ending \
                  scene-lock-v1/production/IMAGE_IMPORT_MANIFEST_0819.md
          git rm .github/workflows/import-final-images.yml
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'assets: import final V58 images'
          git push origin HEAD:review/v58-scene-lock
