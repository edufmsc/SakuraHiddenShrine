<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050208" />
<title>櫻隱命館</title>
<meta name="description" content="互動式沉浸命館：四卷皆可走，完成後開啟總命牒。" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app" class="app" data-route="home" data-scene="welcome">
  <picture class="background-picture">
    <source id="sceneSource" media="(max-width: 720px)" srcset="">
    <img id="sceneImage" class="background" src="" alt="櫻隱命館" />
  </picture>
  <div id="loading" class="loading" hidden><span></span><span></span><span></span></div>
  <div class="vignette"></div>
  <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>
  <div id="scrollOverlay" class="scroll-overlay" hidden aria-live="polite"></div>
  <div id="sceneHotspots" class="scene-hotspots" aria-live="polite"></div>

  <header class="topbar">
    <button id="homeButton" class="topbar-button" type="button" aria-label="回命館">⌂</button>
    <div class="brand">
      <span class="brand-seal">櫻</span>
      <span>
        <small>櫻隱命館</small>
        <strong id="routeTitle">序｜霧門</strong>
      </span>
    </div>
    <div class="topbar-actions">
      <button id="galleryButton" class="topbar-button" type="button" aria-label="藏景">景</button>
      <button id="soundButton" class="topbar-button" type="button" aria-label="聲音">♫</button>
    </div>
  </header>

  <main id="storyPanel" class="story-panel safe-left">
    <div id="panelScroll" class="panel-scroll">
      <section class="headline-block">
        <p id="eyebrow" class="eyebrow"></p>
        <h1 id="headline"></h1>
        <p id="subheadline" class="subheadline"></p>
      </section>
      <section id="dialogue" class="dialogue" aria-live="polite"></section>
      <section id="choices" class="choices"></section>
      <p id="progressText" class="progress-text"></p>
    </div>
  </main>

  <section id="hubPanel" class="hub-panel" hidden>
    <div class="hub-intro">
      <p class="eyebrow">四卷已開</p>
      <h2>今晚先走哪一道？</h2>
      <p>四卷都能進。每一卷都會留下不同的命痕；四卷全封後，第五卷才會出現。</p>
    </div>
    <div id="hubCards" class="hub-cards"></div>
  </section>

  <section id="galleryPanel" class="gallery-panel" hidden>
    <div class="gallery-shell">
      <div class="gallery-head">
        <div>
          <p class="eyebrow">藏景</p>
          <h2>你已留下的畫面</h2>
        </div>
        <button id="galleryClose" class="gallery-close" type="button">×</button>
      </div>
      <div id="galleryGrid" class="gallery-grid"></div>
    </div>
  </section>

  <section id="modal" class="modal" hidden>
    <div class="modal-card">
      <button id="modalClose" class="modal-close" type="button">×</button>
      <div id="modalContent"></div>
    </div>
  </section>
</div>

<script src="story.js"></script>
<script src="script.js"></script>
</body>
</html>
